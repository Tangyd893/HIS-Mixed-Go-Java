services:
  postgresql:
    image: postgres:16-alpine
    container_name: his-postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - his-mixed-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: his-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me_456}
    volumes:
      - redis_data:/data
    networks:
      - his-mixed-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: his-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change_me_789}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - his-mixed-net
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: his-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
    volumes:
      - nacos_data:/home/nacos/data
    networks:
      - his-mixed-net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: his-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_012}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - his-mixed-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: his-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - postgresql
      - redis
    networks:
      - his-mixed-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  nacos_data:
  minio_data:

networks:
  his-mixed-net:
    driver: bridge
