version: "3.9"

services:
  his-auth:
    build:
      context: ../backend/java
      dockerfile: ../../docker/Dockerfile.java
    container_name: his-auth
    ports:
      - "8096:8096"
      - "9096:9096"
    environment:
      DB_HOST: postgresql
      DB_NAME: his_auth
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_456}
      RABBITMQ_URL: amqp://admin:${RABBITMQ_PASSWORD:-change_me_789}@rabbitmq:5672/
      NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    depends_on:
      - postgresql
      - redis
      - rabbitmq
      - nacos
    networks:
      - his-mixed-net
    restart: unless-stopped

