# ============================================================
# auth
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: his-mixed
  labels:
    app: auth
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      name: http
    - port: 9081
      targetPort: 9081
      name: grpc
  selector:
    app: auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: his-mixed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: his-mixed/java-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
            - containerPort: 9081
              name: grpc
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: his-mixed-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: his-mixed-config
                  key: DB_PORT
            - name: DB_NAME
              value: his_auth
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: his-mixed-secrets
                  key: DB_PASSWORD
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: his-mixed-config
                  key: REDIS_ADDR
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: his-mixed-secrets
                  key: REDIS_PASSWORD
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: his-mixed-config
                  key: RABBITMQ_URL
            - name: NACOS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: his-mixed-config
                  key: NACOS_ADDR
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
---
