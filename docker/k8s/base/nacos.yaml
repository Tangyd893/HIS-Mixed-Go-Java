apiVersion: v1
kind: Service
metadata:
  name: nacos-service
  namespace: his-mixed
  labels:
    app: nacos
spec:
  type: ClusterIP
  ports:
    - port: 8848
      targetPort: 8848
      name: http
  selector:
    app: nacos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: his-mixed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      containers:
        - name: nacos
          image: nacos/nacos-server:v2.4.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8848
              name: http
          env:
            - name: MODE
              value: standalone
            - name: NACOS_AUTH_ENABLE
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: nacos-data
              mountPath: /home/nacos/data
      volumes:
        - name: nacos-data
          emptyDir: {}
