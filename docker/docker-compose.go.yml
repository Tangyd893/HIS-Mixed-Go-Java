version: "3.9"

services:
  gateway:
    build:
      context: ../backend/go
      dockerfile: ../../docker/Dockerfile.go
    container_name: his-gateway
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgresql
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://admin:${RABBITMQ_PASSWORD:-change_me_789}@rabbitmq:5672/
    depends_on:
      - postgresql
      - redis
      - rabbitmq
      - nacos
    networks:
      - his-mixed-net
    restart: unless-stopped

