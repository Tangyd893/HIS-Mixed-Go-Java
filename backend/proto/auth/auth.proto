syntax = "proto3";

package auth;

option go_package = "github.com/his-mixed/go/pkg/grpc/auth";
option java_package = "com.hismixed.grpc.auth";

import "google/protobuf/timestamp.proto";

// 认证服务
service AuthService {
  // 登录
  rpc Login(LoginRequest) returns (LoginResponse);
  // 刷新令牌
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
}

// 登录请求
message LoginRequest {
  string username = 1;                        // 用户名
  string password = 2;                        // 密码
  string grant_type = 3;                      // 授权类型
  string client_id = 4;                       // 客户端ID
}

// 登录响应
message LoginResponse {
  string access_token = 1;                    // 访问令牌
  string refresh_token = 2;                   // 刷新令牌
  string token_type = 3;                      // 令牌类型
  int64 expires_in = 4;                       // 过期时间（秒）
  int64 user_id = 5;                          // 用户ID
  string username = 6;                        // 用户名
  string real_name = 7;                       // 真实姓名
  repeated string roles = 8;                  // 角色列表
  repeated string permissions = 9;            // 权限列表
}

// 刷新令牌请求
message RefreshTokenRequest {
  string refresh_token = 1;                   // 刷新令牌
}

// 刷新令牌响应
message RefreshTokenResponse {
  string access_token = 1;                    // 新访问令牌
  string refresh_token = 2;                   // 新刷新令牌
  string token_type = 3;                      // 令牌类型
  int64 expires_in = 4;                       // 过期时间（秒）
}
